<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vim Coach Training Ground</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">V</div>
          <div>
            <p class="eyebrow">VIM COACH</p>
            <h1>Training ground</h1>
          </div>
        </div>
        <div id="batch-status" aria-live="polite"></div>
      </header>

      <nav class="view-tabs" aria-label="Vim Coach views">
        <button class="tab active" data-view="goals">Challenges</button>
        <button class="tab" data-view="lessons">Lessons <span id="lesson-count" class="tab-count">0</span></button>
        <button class="tab" data-view="stats">Stats</button>
      </nav>

      <main>
        <section id="goals-view" class="view active" aria-labelledby="goals-title">
          <div class="view-heading">
            <div>
              <p class="section-kicker">YOUR JOURNEY</p>
              <h2 id="goals-title">Active challenges</h2>
              <p id="goals-summary">Loading your progress…</p>
            </div>
            <div id="level-badge" class="level-badge">LEVEL 1</div>
          </div>
          <div id="stat-strip" class="stat-strip"></div>
          <div id="challenge-list" class="challenge-list"></div>
          <section class="achievement-section">
            <div class="section-heading-row">
              <h2>Achievements</h2>
              <span id="achievement-count" class="muted"></span>
            </div>
            <div id="achievement-list" class="achievement-list"></div>
          </section>
        </section>

        <section id="lessons-view" class="view" aria-labelledby="lessons-title">
          <div class="view-heading">
            <div>
              <p class="section-kicker">DISCOVER</p>
              <h2 id="lessons-title">Lesson inbox</h2>
              <p id="lesson-summary">Loading lessons…</p>
            </div>
            <button id="reset" class="secondary compact">Reset statuses</button>
          </div>
          <div id="inbox"></div>
        </section>

        <section id="stats-view" class="view" aria-labelledby="stats-title">
          <div class="view-heading">
            <div>
              <p class="section-kicker">PROGRESS REPORT</p>
              <h2 id="stats-title">Your Vim growth</h2>
              <p>Every successful use builds lasting muscle memory.</p>
            </div>
          </div>
          <div id="stats-dashboard"></div>
        </section>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
